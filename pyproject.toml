[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-phal-plugin-gpsd"
dynamic = ["version"]
description = "A PHAL plugin for mycroft"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "JarbasAi", email = "jarbasai@mailfence.com"}
]
requires-python = ">=3.6"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Text Processing :: Linguistic",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3"
]
dependencies = [
    "ovos-plugin-manager>=2.1.0,<3.0.0",
    "gpsdclient",
    "reverse_geocoder",
    "python-geoip-geolite2",
    "timezonefinder"
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-PHAL-plugin-gpsd"

[project.entry-points."opm.phal"]
"ovos-phal-plugin-gpsd" = "ovos_phal_plugin_gpsd:GPSDPlugin"

[tool.setuptools.dynamic]
version = {attr = "ovos_phal_plugin_gpsd.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["ovos_phal_plugin_gpsd*"]

[tool.setuptools.package-data]
ovos_phal_plugin_gpsd = ["*.json"]
